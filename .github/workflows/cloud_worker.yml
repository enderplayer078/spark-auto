name: Cloud Exercise Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-auto-worker
  cancel-in-progress: false

jobs:
  run-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable Chromium sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Process queue
        env:
          FIREBASE_RTDB_BASE: ${{ secrets.FIREBASE_RTDB_BASE }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INBOX_PRIVATE_KEY: ${{ secrets.INBOX_PRIVATE_KEY }}
          HMAC_SECRET_KEY: ${{ secrets.HMAC_SECRET_KEY }}
        run: |
          python3 cloud_worker.py --stay-alive 20 --poll-interval 3
